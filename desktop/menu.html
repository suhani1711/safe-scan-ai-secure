<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent;font:14px system-ui,"Segoe UI",sans-serif;user-select:none;overflow:hidden}
#c{margin:6px;background:#131a2e;color:#e8ecf8;border:1px solid #25304d;border-radius:14px;padding:6px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
button{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:9px;font:inherit;cursor:pointer;min-height:38px}
button:hover{background:#1c2540}button small{color:#9aa5c0;font-size:11px}.s{padding-left:30px}hr{border:0;border-top:1px solid #25304d;margin:4px 2px}</style>
<div id="c"><button data-i="link">🔗 Links</button><button data-i="sms">💬 SMS</button><button data-i="email">📧 Mail</button>
<button id="q">🔳 QR <small>▾</small></button><div id="qs" hidden><button class="s" data-i="qrcam">📷 Camera / Upload</button><button class="s" data-i="snip">✂️ Snip QR on screen <small>Ctrl+Shift+Q</small></button></div>
<button data-i="sel">📝 Scan selected text <small>Ctrl+Shift+S</small></button><hr>
<button data-i="dash">📊 Dashboard</button><button data-i="help">🚨 Help (already clicked?)</button><hr>
<button data-i="reset">↩ Reset shield position</button><button data-i="hide">Hide shield</button><button data-i="quit">Quit SafeScan</button></div>
<script>const c=document.getElementById("c"),fit=()=>desk.menuSize(c.offsetHeight+12);
c.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="q"){const q=document.getElementById("qs");q.hidden=!q.hidden;fit();return}desk.menuAction(b.dataset.i)};
document.body.onmouseenter=()=>desk.menuEnter();document.body.onmouseleave=()=>desk.menuLeave();addEventListener("load",fit);</script>
