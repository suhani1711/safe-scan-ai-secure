name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-packager . SafeScan-AI --platform=win32 --arch=x64 --out=dist --overwrite --asar.unpackDir=node_modules/@koromix
      - run: Compress-Archive -Path dist/SafeScan-AI-win32-x64 -DestinationPath SafeScan-AI-Desktop-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SafeScan-AI-Desktop-Windows
          path: SafeScan-AI-Desktop-Windows.zip
