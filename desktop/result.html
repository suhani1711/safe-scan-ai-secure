<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent;font:14px system-ui,"Segoe UI",sans-serif;color:#e8ecf8;user-select:none;overflow:hidden}
#c{margin:6px;background:#131a2e;border:1px solid #25304d;border-radius:16px;padding:14px;box-shadow:0 3px 9px rgba(0,0,0,.35)}
.h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}.x{background:none;border:0;color:#9aa5c0;font-size:18px;cursor:pointer;padding:2px 8px;border-radius:8px}.x:hover{background:#1c2540}
.mu{color:#9aa5c0;font-size:12px}.q{background:#0b1020;border-radius:10px;padding:8px 10px;margin:6px 0;word-break:break-word}
.tr{display:flex;gap:14px;align-items:center;margin:10px 0}.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;flex:none}.ring b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#131a2e;font-size:22px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;color:#fff}.bk{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;align-items:center;font-size:12px;margin:3px 0}.bar{height:7px;border-radius:9px;background:#25304d;overflow:hidden}.bar i{display:block;height:100%}
ul{margin:6px 0 6px 18px;padding:0}.btn{border:1px solid #25304d;background:#0b1020;color:inherit;padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin:8px 8px 0 0}.p{background:linear-gradient(135deg,#2f5bff,#7c3aed);border:0}
.sp{width:18px;height:18px;border:3px solid #25304d;border-top-color:#2f5bff;border-radius:50%;animation:s .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}pre{white-space:pre-wrap;font:11px/1.4 Consolas,monospace;color:#9aa5c0;margin:6px 0 0}</style>
<div id="c"></div><script src="analyze.js"></script><script>
const c=document.getElementById("c"),esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const head=t=>`<div class="h"><span>🛡️ ${t}</span><button class="x" data-a="close" aria-label="Close">✕</button></div>`;
const fit=()=>desk.resultSize(c.offsetHeight+12);
function render(s){
if(s.state==="loading"){c.innerHTML=head("SafeScan")+'<div><span class="sp"></span>Reading your selected text…</div>'}
else if(s.state==="fail"){c.innerHTML=head("Couldn’t read a selection")+'<p style="margin:0">Select some text in the app first, then choose <b>Scan selected text</b> again. Some apps (and apps running as administrator) don’t allow copying this way.</p><button class="btn p" data-a="paste">Paste text instead</button><button class="btn" data-a="close">Close</button>'+(s.detail?'<pre>'+esc(s.detail)+'</pre>':"")}
else{let r,err="";try{r=/^(https?:\/\/)?[^\s\/]+\.[a-z]{2,}(\/\S*)?$/i.test(s.text)&&!/\s/.test(s.text)?SafeScan.url(s.text):SafeScan.sms(s.text)}catch(e){err=e.message}
if(!r){c.innerHTML=head("SafeScan")+'<p class="mu">'+esc(err||"Unable to analyze this text.")+'</p><button class="btn" data-a="close">Close</button>'}
else{const col={"SAFE":["#16a34a","🟢 Safe"],"SUSPICIOUS":["#d97706","🟠 Suspicious"],"PHISHING DETECTED":["#dc2626","🔴 Phishing Detected"]}[r.status];
c.innerHTML=head("Selected text result")+(s.fromClip?'<div class="mu">Nothing new could be copied automatically, so this is the text already on your clipboard.</div>':"")+
'<div class="q">“'+esc(s.text.length>110?s.text.slice(0,110)+"…":s.text)+'”</div>'+
`<div class="tr"><div class="ring" style="background:conic-gradient(${col[0]} ${r.trust*3.6}deg,#25304d 0)"><b>${r.trust}</b></div><div><div class="mu">Trust Score</div><span class="badge" style="background:${col[0]}">${col[1]}</span></div></div>`+
(r.breakdown.slice(0,3).map(b=>`<div class="bk"><span>${esc(b.name)}</span><div class="bar"><i style="width:${b.level}%;background:${col[0]}"></i></div></div>`).join(""))+
'<ul>'+r.indicators.slice(0,3).map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul><div style="margin-top:6px"><b>Safe Action:</b> '+esc(r.recommendation)+'</div>'+
'<button class="btn p" data-a="full">Full report</button><button class="btn" data-a="close">Close</button><div class="mu" style="margin-top:8px">Rule-based estimate, not a guarantee. Nothing was opened or uploaded.</div>'}}
fit()}
c.onclick=e=>{const b=e.target.closest("[data-a]");if(b)desk.resultAction(b.dataset.a)};
desk.onResult(render);desk.resultReady();
</script>
