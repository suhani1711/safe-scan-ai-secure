<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;cursor:crosshair;background:#000;user-select:none}
#i{position:fixed;inset:0;width:100%;height:100%}#m{position:fixed;inset:0;background:rgba(0,0,0,.4)}
#b{position:fixed;border:2px solid #5eb3e8;display:none;box-shadow:0 0 0 9999px rgba(0,0,0,.4)}
#h{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#131a2e;color:#fff;padding:8px 16px;border-radius:99px;font:14px system-ui}</style>
<img id="i" alt=""><div id="m"></div><div id="b"></div><div id="h">Drag around the QR code. Press Esc to cancel.</div>
<script>const i=document.getElementById("i"),b=document.getElementById("b"),m=document.getElementById("m");let s=null,r=null;
desk.snipImage().then(u=>{i.src=u});
document.addEventListener("keydown",e=>{if(e.key==="Escape")desk.snipDone(null)});
document.onpointerdown=e=>{s={x:e.clientX,y:e.clientY};b.style.display="block";m.style.display="none"};
document.onpointermove=e=>{if(!s)return;r={x:Math.min(s.x,e.clientX),y:Math.min(s.y,e.clientY),w:Math.abs(e.clientX-s.x),h:Math.abs(e.clientY-s.y),vw:innerWidth,vh:innerHeight};Object.assign(b.style,{left:r.x+"px",top:r.y+"px",width:r.w+"px",height:r.h+"px"})};
document.onpointerup=()=>{desk.snipDone(r&&r.w>=20&&r.h>=20?r:null)};</script>
